<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7ec" />
    <meta name="robots" content="noindex" />
    <title>404 — тут порожньо | Hot Testing</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #fff7ec;
        color: #191917;
        font:
          1rem/1.65 Arial,
          sans-serif;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 42rem;
      }
      p {
        margin: 1rem 0;
      }
      h1 {
        font-size: clamp(5rem, 22vw, 10rem);
        line-height: 1;
        margin: 1rem 0;
        color: #df1908;
        letter-spacing: -0.06em;
      }
      h2 {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.2;
      }
      .brand {
        font-weight: 900;
        letter-spacing: 0.06em;
      }
      .button {
        display: inline-block;
        padding: 0.9rem 1.4rem;
        margin-top: 1rem;
        background: #191917;
        color: #fff7ec;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
      }
      .button:hover {
        background: #df1908;
      }
      :focus-visible {
        outline: 3px solid #df1908;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <p class="brand">HOT TESTING</p>
      <h1>404</h1>
      <h2>Оцей тест таки впав.</h2>
      <p>Такої сторінки немає. Курси й свої люди — на головній.</p>
      <a
        class="button"
        id="home-link"
        href="https://hottesting.github.io/community/"
        >Повернутися на головну ↗</a
      >
    </main>
    <script>
      // GitHub serves this document at the missing URL, including nested paths.
      // Keep it self-contained; select the known project base only on github.io.
      const base =
        location.hostname.toLowerCase() === "hottesting.github.io"
          ? "/community/"
          : "/";
      if (location.protocol !== "file:")
        document.getElementById("home-link").href = base;
    </script>
  </body>
</html>
